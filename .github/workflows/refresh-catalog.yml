name: Refresh CiRCLE PLUS catalog

on:
  workflow_dispatch:
  schedule:
    # 07:30 KST every Saturday (22:30 UTC Friday)
    - cron: '30 22 * * 5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh and validate CiRCLE PLUS data
        run: npm run refresh:catalog
      - name: Test
        run: npm test
      - name: Build
        run: |
          npm run check:planner-config
          npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Commit refreshed data
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- \
            src/data/circle-plus.generated.json \
            src/data/maimai.generated.json \
            src/data/maishift.generated.json; then
            echo "No CiRCLE PLUS data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/data/circle-plus.generated.json \
            src/data/maimai.generated.json \
            src/data/maishift.generated.json
          git commit -m "Refresh CiRCLE PLUS data"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    if: needs.refresh.outputs.data_changed == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
