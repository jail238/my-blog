name: Refresh Maishift records

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      records_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Import Maishift records
        run: npm run sync:records
      - name: Detect refreshed data changes
        id: data
        shell: bash
        run: |
          if git diff --quiet -- \
            src/data/circle-plus.generated.json \
            src/data/maimai.generated.json \
            src/data/maishift.generated.json \
            src/data/jackets.generated.json \
            public/assets/maimai/jackets; then
            echo "No Maishift record or catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.data.outputs.changed == 'true'
        run: npm test
      - name: Build
        if: steps.data.outputs.changed == 'true'
        run: |
          npm run check:planner-config
          npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Commit refreshed records
        id: commit
        if: steps.data.outputs.changed == 'true'
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/data/circle-plus.generated.json \
            src/data/maimai.generated.json \
            src/data/maishift.generated.json \
            src/data/jackets.generated.json \
            public/assets/maimai/jackets
          git commit -m "Refresh Maishift records"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    if: needs.refresh.outputs.records_changed == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
